name: Publish GitHub Pages

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "index.html"
      - "404.html"
      - ".nojekyll"
      - "assets/**"
      - "landing-pages/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit the static site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html .nojekyll assets landing-pages
          if git diff --staged --quiet; then
            echo "Static site already matches this commit."
            exit 0
          fi
          git commit -m "Publish the portfolio for GitHub Pages"
          git push
