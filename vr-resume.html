<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Ankit Sharma — Sr. Technology Specialist. Interactive 360° VR resume: About, Experience, Skills and Education built with A-Frame.">
   <title>Ankit Sharma - VR Resume</title>
    <script src="vrresume/aframe.min.js"></script>
     <!--- Aframe text component & helvetiker_regular typeface conversion by Kevin Ngo https://github.com/ngokevin/aframe-text-component -->
    <script src="vrresume/aframe-text-component.min.js"></script>
    <script src="vrresume/helvetiker_regular.typeface.js"></script>
</head>

<body>
    <img src="vrresume/blue-sky.jpg" width="100%" height="100%">
    <a-scene>
        <a-assets>
            <a-mixin id="font" text="font: helvetiker" material="color: white"></a-mixin>
            <a-mixin id="front" position="-1 1.8 -1"></a-mixin>
            <a-mixin id="left" position="-5 1.8 3" scale="0.5 0.5" rotation="-180 -90 180"></a-mixin>
            <a-mixin id="right" position="5 1.8 4" scale="0.5 0.5" rotation="180 90 180"></a-mixin>
            <a-mixin id="behind" position="-0 1.8 9" scale="0.5 0.5" rotation="180 0 -180"></a-mixin>
        </a-assets>
        <a-entity id="about">
            <a-entity mixin="font front" text="text: Ankit Sharma" position="-1 3.8 -1" scale="2.5 2.5" material="color:red">
            </a-entity>
            <a-entity mixin="font front" text="text: Sr. Technology Specialist" position="-1 2.8 -1" scale="1.7 1.7">
            </a-entity>
            <a-entity mixin="font front" text="text: ankit_998877@yahoo.com" position="-1 2.0 -1" scale="1 1" material="color:black">
            </a-entity>
            <a-entity mixin="font front" text="text: Pune, India - 10+ yrs OSS Compliance" position="-1 1.3 -1" scale="1 1" material="color:yellow"></a-entity>
        </a-entity>
        <a-entity id="experience">
            <a-entity mixin="font right" text="text: Amdocs" position="5 3.8 3"></a-entity>
            <a-entity mixin="font right" text="text: 8/21 - Present" position="5 3.8 7"></a-entity>
            <a-entity mixin="font right" text="text: Edgeverve Systems Ltd." position="5 3.4 3"></a-entity>
            <a-entity mixin="font right" text="text: 5/19 - 7/21" position="5 3.4 7">
            </a-entity>
            <a-entity mixin="font right" text="text: Siemens Pvt. Ltd." position="5 3.0 3"></a-entity>
            <a-entity mixin="font right" text="text: 12/16 - 5/19" position="5 3.0 7">
            </a-entity>
            <a-entity mixin="font right" text="text: Lyra Infosystems " position="5 2.6 3">
            </a-entity>
            <a-entity mixin="font right" text="text: 04/14 - 11/16" position="5 2.6 7">
            </a-entity>
        </a-entity>
        <a-entity id="skills">
            <a-entity mixin="font behind" text="text: Skills" position="-0 3.8 9" scale="1 1" material="color:red">
            </a-entity>
            <a-entity mixin="font behind" text="text: * OSS Compliance" position="-0 3.1 9"></a-entity>
            <a-entity mixin="font behind" text="text: * Python" position="-0 2.8 9"></a-entity>
            <a-entity mixin="font behind" text="text: * Vibe Coding" position="-0 2.5 9"></a-entity>
            <a-entity mixin="font behind" text="text: * AI-assisted Review" position="-0 2.2 9"></a-entity>
            <a-entity mixin="font behind" text="text: * Web Development" position="-0 1.9 9"></a-entity>
            <a-entity mixin="font behind" text="text: * Black Duck Hub" position="-0 1.6 9"></a-entity>
            <a-entity mixin="font behind" text="text: * FOSSology" position="-0 1.3 9"></a-entity>
            <a-entity mixin="font behind" text="text: * SBOM Automation" position="-0 1 9"></a-entity>
        </a-entity>
        </a-entity>
        <a-entity id="education">
            <a-entity mixin="font left" text="text: Education" position="-5 3.8 4" material="color:red">
            </a-entity>
            <a-entity mixin="font left" text="text: PICT Pune" position="-5 3.4 4">
            </a-entity>
            <a-entity mixin="font left" text="text: B.E. in IT" position="-5 3.0 4">
            </a-entity>
            <a-entity mixin="font left" text="text: Pune, India" position="-5 2.6 4"></a-entity>

</html>
